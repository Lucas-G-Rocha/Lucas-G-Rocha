```yaml
name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # GitHub Stats
      - name: Generate Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Lucas-G-Rocha&show_icons=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # Top Languages
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Lucas-G-Rocha&layout=compact&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # Contribution Streak
      - name: Generate Contribution Stats
        uses: zients/github-readme-streak-stats@v2
        with:
          user: Lucas-G-Rocha
          token: ${{ secrets.GH_STATS_TOKEN }}
          output: profile/streak.svg
          disable_animations: true

      # Commit generated files
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "Update GitHub stats"

          git push
```
